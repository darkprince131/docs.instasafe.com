[build]
  command = "pip install -r requirements.txt && mkdocs build"
  publish = "site"

[build.environment]
  # Netlify's default Python is older than mkdocs-material needs.
  PYTHON_VERSION = "3.11"

# This is a review copy of the documentation. Keep it out of search engines so it
# never competes with docs.instasafe.com, which is the canonical site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
